# Deploy accepted main releases only to the resources assigned to team sbdec8d5b.
# Uses the course Portal's four GitHub Environment variables and WIF; it never
# creates/deletes resources or changes IAM, billing, APIs, or secrets.
name: Deploy course application

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional rollback to an existing full 40-character commit SHA; leave empty to deploy current main.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  # Re-run the existing Lab 5 quality gate for ordinary releases. A rollback
  # reuses an existing immutable image and skips the build/test job.
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_NUMBER: "670075229477"
      TEAM_PREFIX: sbdec8d5b
      SERVICE_NAME: sbdec8d5b
      MIGRATE_JOB_NAME: sbdec8d5b-migrate
      ARTIFACT_REGISTRY_REPOSITORY: sbdec8d5b
      IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sbdec8d5b/sbdec8d5b:${{ inputs.image_tag || github.sha }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}

    steps:
      - name: Check out source without persisting a token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate portal WIF settings and team resources
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "cpe-se-course-2026"
          test "$REGION" = "asia-southeast1"
          test "$PROJECT_NUMBER" = "670075229477"
          test "$WIF_PROVIDER" = "projects/670075229477/locations/global/workloadIdentityPools/sbdec8d5b-pool/providers/sbdec8d5b-provider"
          test "$WIF_SERVICE_ACCOUNT" = "sbdec8d5b-deployer@cpe-se-course-2026.iam.gserviceaccount.com"
          [[ "$IMAGE" =~ ^asia-southeast1-docker\.pkg\.dev/cpe-se-course-2026/sbdec8d5b/sbdec8d5b:[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK" == true || "$ROLLBACK" == false ]]

      - name: Authenticate to Google Cloud using portal-provided WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify only this team's provisioned resources exist
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REGISTRY_REPOSITORY" \
            --project="$PROJECT_ID" --location="$REGION" --format='value(name)' >/dev/null
          gcloud run jobs describe "$MIGRATE_JOB_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(metadata.name)' >/dev/null
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(metadata.name)' >/dev/null

      - name: Build and push commit-tagged image
        if: env.ROLLBACK != 'true'
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # release.sh verifies the image digest, updates/runs the team's Prisma
      # migration job, then updates only this team's service and traffic.
      - name: Verify image, migrate, and deploy the service
        run: bash deploy/release.sh

      - name: Set up Python for the read-only smoke test
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check deployed health, database readiness, and UI
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          EXPECTED_COMMIT_SHA: ${{ env.IMAGE_TAG }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record release evidence
        run: |
          {
            echo '### CPE334 application deployment'
            echo "- Project / region: \`$PROJECT_ID / $REGION\`"
            echo "- Team prefix: \`$TEAM_PREFIX\`"
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Immutable image digest: \`$DEPLOYED_IMAGE\`"
            echo "- Service: \`$SERVICE_NAME\`"
            echo "- Public URL: $SERVICE_URL"
            echo "- Rollback: $ROLLBACK"
            echo '- Migration, service update, and read-only smoke test completed in this run.'
          } >> "$GITHUB_STEP_SUMMARY"

