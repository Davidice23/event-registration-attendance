# Deploy accepted main releases to the resources already provisioned by the
# CPE334 Cloud Portal. This workflow updates only names from the Team resources
# tab; it never creates/deletes resources or changes IAM, billing, APIs or secrets.
name: Deploy course application

on:
  # Step 5 first deploys are run manually from a clean main checkout. Keep
  # automatic releases disabled until Step 6's GitHub-to-GCP WIF setup is ready.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy current main or roll back to an existing full 40-character commit SHA (requires WIF setup).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-course-application
  cancel-in-progress: false

jobs:
  # Reuse the pull-request quality gate before each ordinary release.
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The course Portal provides its WIF variables for this repository environment.
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TEAM_PREFIX: ${{ vars.TEAM_PREFIX }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      MIGRATE_JOB_NAME: ${{ vars.MIGRATE_JOB_NAME }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE: ${{ vars.IMAGE }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}

    steps:
      - name: Check out source without persisting a token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate portal-provided settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test "$PROJECT_ID" = "cpe-se-course-2026"
          test "$REGION" = "asia-southeast1"
          [[ "$TEAM_PREFIX" =~ ^[a-z][a-z0-9-]*$ ]]
          case "$SERVICE_NAME" in "$TEAM_PREFIX"|"$TEAM_PREFIX"-*) ;; *) exit 1 ;; esac
          case "$MIGRATE_JOB_NAME" in "$TEAM_PREFIX"|"$TEAM_PREFIX"-*) ;; *) exit 1 ;; esac
          case "$ARTIFACT_REGISTRY_REPOSITORY" in "$TEAM_PREFIX"|"$TEAM_PREFIX"-*) ;; *) exit 1 ;; esac
          [[ "$IMAGE" =~ ^asia-southeast1-docker\.pkg\.dev/cpe-se-course-2026/([^/]+)/([^/:]+)(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?$ ]]
          IMAGE_REPOSITORY="${BASH_REMATCH[1]}"
          [[ "$IMAGE_REPOSITORY" == "$ARTIFACT_REGISTRY_REPOSITORY" ]]
          case "$IMAGE_REPOSITORY" in "$TEAM_PREFIX"|"$TEAM_PREFIX"-*) ;; *) exit 1 ;; esac
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK" == true || "$ROLLBACK" == false ]]

      - name: Authenticate to Google Cloud using portal-provided WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify only the exact portal-provisioned resources
        run: |
          gcloud artifacts repositories describe "$ARTIFACT_REGISTRY_REPOSITORY" \
            --project="$PROJECT_ID" --location="$REGION" --format='value(name)' >/dev/null
          gcloud run jobs describe "$MIGRATE_JOB_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(metadata.name)' >/dev/null
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(metadata.name)' >/dev/null

      - name: Build and push image tagged with the commit SHA
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE_BASE="${IMAGE%:*}"
          TAGGED_IMAGE="$IMAGE_BASE:$IMAGE_TAG"
          docker build --tag "$TAGGED_IMAGE" .
          docker push "$TAGGED_IMAGE"

      - name: Verify image, run migration job, and update service
        run: bash deploy/release.sh

      - name: Set up Python for the read-only smoke test
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check deployed health, database readiness, and UI
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record release evidence
        run: |
          {
            echo '### CPE334 application deployment'
            echo "- Project / region: \`$PROJECT_ID / $REGION\`"
            echo "- Team prefix: \`$TEAM_PREFIX\`"
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Immutable image digest: \`$DEPLOYED_IMAGE\`"
            echo "- Service: \`$SERVICE_NAME\`"
            echo "- Public URL: $SERVICE_URL"
            echo "- Rollback: $ROLLBACK"
            echo '- Migration, service update, and smoke test completed in this run.'
          } >> "$GITHUB_STEP_SUMMARY"
