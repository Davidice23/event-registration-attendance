# CI & Docker Build — Lab 5 Step 3 (#19), adapted from the Lab 5 Starter Kit.
#
# Runs on every Pull Request into staging and main, manually, and as a reusable
# workflow for the deploy pipeline (Step 7). It never deploys anything.
#
# DO NOT RENAME the job id `test-and-docker`: the ruleset for `main` requires it.
#
# The database values below are throw-away CI placeholders for a service container
# that exists only during the job. They are not secrets.
name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Dedicated test database, matching the guarded local setup: loopback,
    # port 5434, database event_registration_test, user event_app.
    services:
      postgres-test:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: event_app
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: event_registration_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U event_app -d event_registration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The runners refuse to start unless both URLs are set, loopback, and distinct.
      # The development URL is only validated, never connected to, in CI.
      DATABASE_URL: postgresql://event_app:ci-only-placeholder@127.0.0.1:5433/event_registration_dev?schema=public
      TEST_DATABASE_URL: postgresql://event_app:ci-only-placeholder@127.0.0.1:5434/event_registration_test?schema=public
      APP_ORIGIN: http://127.0.0.1:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (safety, client, server)
        run: npm test

      - name: Integration tests on PostgreSQL (migrations + API/DB)
        run: npm run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E tests (Playwright)
        run: npm run test:e2e

      - name: Build client and server
        run: npm run build

      - name: Validate Prisma schema
        run: npm run db:validate

      # The Dockerfile arrives in Step 2 (#18). Until it is on this branch the step is
      # skipped and says so; afterwards a broken image build fails the job.
      - name: Verify production Docker image builds
        if: hashFiles('Dockerfile') != ''
        run: docker build --pull -t event-registration:ci-${{ github.sha }} .

      - name: Note when no Dockerfile exists yet
        if: hashFiles('Dockerfile') == ''
        # Block scalar: in a plain YAML value " #" would start a comment and cut the command.
        run: |
          echo "::notice title=Docker build skipped::No Dockerfile on this commit yet (added in Lab 5 Step 2, #18)."
